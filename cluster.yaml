apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: <cluster-name>
  region: ap-south-1
  version: "1.27"

managedNodeGroups:
  - name: <node-group-name>
    instanceType: t3.medium
    minSize: 1
    maxSize: 4
    desiredCapacity: 3
    iam:
      instanceRoleARN: arn:aws:iam::438017212388:role/<role-name>
