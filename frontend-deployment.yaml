apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: bca-project
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: <aws_account_id>.dkr.ecr.us-west-2.amazonaws.com/bca-todo/frontend:latest
        ports:
        - containerPort: 3000
        env:
        - name: REACT_APP_API_URL
          value: "http://api.bca-project.svc.cluster.local:3001/api"
