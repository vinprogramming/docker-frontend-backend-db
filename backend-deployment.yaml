apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: bca_project
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: 438017212388.dkr.ecr.ap-south-1.amazonaws.com/bca-todo/backend:latest
        ports:
        - containerPort: 3001
